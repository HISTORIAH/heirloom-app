<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      The stocks app shell, like app.heirlm.xyz's: every route is wallet-gated
      and per-user, so the origin is noindex and carries no marketing copy.
      Per-route titles are set from src/components/Seo.tsx.
    -->
    <title>Heirloom Stocks</title>
    <meta
      name="description"
      content="Back up your tokenized stocks and leave them to an heir — Heirloom on Solana."
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://stocks.heirlm.xyz/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
