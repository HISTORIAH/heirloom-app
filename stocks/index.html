<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      The stocks shell. The root is the marketing page and the one route meant
      to be indexed; the app routes behind it are per-wallet, so they are not.
      Robots, titles and descriptions are set per route from
      src/components/Seo.tsx, and public/robots.txt keeps crawlers to the root.
      These defaults describe the landing, for anything that doesn't run JS.

      That includes every link preview: X, Slack, iMessage and the rest read
      the shell as served and never run the app, so the share card has to be
      named here, not only in Seo.tsx. public/og-image.png is 2x (2400 x 1260);
      its source is the HTML card in the sibling stocks-preview/ folder.
    -->
    <title>Heirloom Stocks — back up your tokenized stocks</title>
    <meta
      name="description"
      content="Back up your xStocks and Ondo stocks to a recovery wallet you control, or leave them to an heir. They stay in your wallet and stay tradeable. Heirloom on Solana."
    />
    <link rel="canonical" href="https://stocks.heirlm.xyz/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Heirloom Stocks" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://stocks.heirlm.xyz/" />
    <meta property="og:title" content="Heirloom Stocks — back up your tokenized stocks" />
    <meta
      property="og:description"
      content="Back up your xStocks and Ondo stocks to a recovery wallet you control, or leave them to an heir. They stay in your wallet and stay tradeable. Heirloom on Solana."
    />
    <meta property="og:image" content="https://stocks.heirlm.xyz/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="Heirloom Stocks. Lose the key. Keep the stocks. Backup for tokenized stocks on Solana, at stocks.heirlm.xyz."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@heirloom_app" />
    <meta name="twitter:creator" content="@heirloom_app" />
    <meta name="twitter:title" content="Heirloom Stocks — back up your tokenized stocks" />
    <meta
      name="twitter:description"
      content="Back up your xStocks and Ondo stocks to a recovery wallet you control, or leave them to an heir. They stay in your wallet and stay tradeable. Heirloom on Solana."
    />
    <meta name="twitter:image" content="https://stocks.heirlm.xyz/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Heirloom Stocks. Lose the key. Keep the stocks. Backup for tokenized stocks on Solana, at stocks.heirlm.xyz."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
