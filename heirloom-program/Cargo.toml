[package]
name = "heirloom-program"
version = "0.1.0"
edition = "2021"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
alloc = []
client = []
debug = []

[dependencies]
quasar-lang = { git = "https://github.com/blueshift-gg/quasar" }
quasar-spl = { git = "https://github.com/blueshift-gg/quasar" }

# quasar-lang = { git = "https://github.com/jim4067/quasar", branch = "jimii/ata-cpi-methods" }
# quasar-spl = { git = "https://github.com/jim4067/quasar", branch = "jimii/ata-cpi-methods" }

solana-account-view = { version = "2.0.0" }
solana-instruction = { version = "3.2.0" }


[dev-dependencies]
heirloom-program-client = { path = "target/client/rust/heirloom-program-client" }
quasar-svm = { version = "0.1" }
solana-account = { version = "3.4.0" }
solana-address = { version = "2.2.0", features = ["decode"] }
solana-instruction = { version = "3.2.0", features = ["bincode"] }
solana-pubkey = { version = "4.1.0" }
