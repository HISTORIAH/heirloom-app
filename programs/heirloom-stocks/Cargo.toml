# Deliberately its own workspace root rather than a member of the repo workspace.
#
# The programs in this repo cannot share one lockfile: `heirloom` is on
# anchor-lang 2.0.0-rc.1 while `heirloom-ika` is on anchor-lang 1.0.2, and the
# generated Rust client pulls the solana-pubkey 4.x stack, which requires
# solana-address 2.7. That combination puts both wincode 0.5 and 0.6 in the graph,
# and every `#[account(borsh)]` struct then fails to compile with a misleading
# `Pubkey: SchemaWrite` error. Resolving here keeps solana-address on 2.6 and
# wincode on a single version. The sibling programs each carry their own lockfile
# for the same reason.
[workspace]

[package]
name = "heirloom-stocks"
version = "0.1.0"
description = "Backup and inheritance for tokenized equities on Solana"
edition = "2021"
rust-version = "1.89.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "heirloom_stocks"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = []

[dependencies]
anchor-lang = { version = "2.0.0-rc.1", features = [] }
anchor-spl = "2.0.0-rc.1"
solana-program-log = { version = "1.1", features = ["macro"] }
wincode = { version = "0.5", features = ["derive"] }

solana-security-txt = "1.1.3"

# Not used directly — these are version pins, and they have to be exact.
#
# anchor-lang 2.0.0-rc.1 generates `#[account(borsh)]` code against wincode 0.5,
# but solana-address 2.7 moved to wincode 0.6 and solana-pubkey 4.3 requires that
# 2.7. With both wincode versions in the graph, `Address` implements the 0.6 traits
# while the derive expects the 0.5 ones, and every account struct fails with
# `Pubkey: SchemaWrite<WincodeConfig> is not satisfied`. A caret requirement is not
# enough here: cargo re-resolves on build and upgrades straight back into the
# broken combination. Lift these together with anchor-lang.
solana-address = "=2.6.0"
solana-pubkey = "=4.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
