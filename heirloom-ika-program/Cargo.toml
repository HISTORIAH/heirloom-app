[package]
name = "heirloom-ika-program"
version = "0.1.0"
edition = "2021"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
alloc = []
client = []
debug = []
idl-build = ["quasar-lang/idl-build"]

[dependencies]
quasar-lang = { git = "https://github.com/blueshift-gg/quasar" }

solana-account-view = { version = "2.0.0" }
solana-address = "2.2.0"
solana-instruction = { version = "3.2.0" }
# Required for CPI invoke_signed_unchecked
solana-instruction-view = { version = "2.0.0" }

[dev-dependencies]
# heirloom-ika-program-client = { path = "target/client/rust/heirloom-ika-program-client" }
quasar-svm = { version = "0.1" }
solana-account = { version = "3.4.0" }
solana-address = { version = "2.2.0", features = ["decode"] }
solana-instruction = { version = "3.2.0", features = ["bincode"] }
solana-pubkey = { version = "4.1.0" }
