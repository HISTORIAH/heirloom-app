                  "text": "If you cannot check in, the vault moves through its grace period and becomes claimable by the wallets you named — that is the intended behaviour, and it is exactly why many people name a backup wallet of their own. If you have a guardian set, they can extend the grace period by 30 days to give you more time to recover access."
