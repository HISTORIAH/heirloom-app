<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      This is the app shell, not a page. Everything it serves is wallet-gated
      and per-user, so the origin is noindex and carries no marketing copy or
      structured data — that all lives on the Astro landing at heirlm.xyz,
      which is prerendered precisely so a crawler never has to see a shell.
      Per-route titles are set from src/components/Seo.tsx.
    -->
    <title>Heirloom App</title>
    <meta
      name="description"
      content="Open an estate, check in, route yield, and claim — the Heirloom app on Solana."
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://app.heirlm.xyz/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
