<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      This is the app shell, not a page. Everything it serves is wallet-gated
      and per-user, so the origin is noindex and carries no marketing copy or
      structured data — that all lives on the Astro landing at heirlm.xyz,
      which is prerendered precisely so a crawler never has to see a shell.
      Per-route titles are set from src/components/Seo.tsx.
    -->
    <title>Heirloom App</title>
    <meta
      name="description"
      content="Open an estate, check in, route yield, and claim — the Heirloom app on Solana."
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://app.heirlm.xyz/" />

    <!--
      Link previews. noindex keeps the app out of search, but its links still
      travel: owners send /inherit to family, and reminders send heirs here.
      X, Telegram, Discord, Slack and iMessage read this file as served and never
      run the app, so without these tags a "claim your inheritance" link unfurls
      as a bare URL, which in crypto reads like phishing. Every route is served
      this one shell, so the card is the same everywhere.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Heirloom" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://app.heirlm.xyz/" />
    <meta property="og:title" content="Heirloom App: manage or claim a crypto estate on Solana" />
    <meta
      property="og:description"
      content="Open an estate, check in, or claim an inheritance you were named for. Heirloom never asks for your seed phrase."
    />
    <meta property="og:image" content="https://heirlm.xyz/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="2373" />
    <meta property="og:image:height" content="1326" />
    <meta property="og:image:alt" content="Heirloom: self-custody crypto inheritance on Solana" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@heirloom_app" />
    <meta name="twitter:title" content="Heirloom App: manage or claim a crypto estate on Solana" />
    <meta
      name="twitter:description"
      content="Open an estate, check in, or claim an inheritance you were named for. Heirloom never asks for your seed phrase."
    />
    <meta name="twitter:image" content="https://heirlm.xyz/og-image.png" />
    <meta name="twitter:image:alt" content="Heirloom: self-custody crypto inheritance on Solana" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
